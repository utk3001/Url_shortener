services:
  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      - MONGO_URL=mongodb://mongo:27017/urlshortener
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis

  worker:
    build: .
    command: node workers/analyticsWorker.js
    environment:
      - MONGO_URL=mongodb://mongo:27017/urlshortener
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mongo_data:
