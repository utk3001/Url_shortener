services:
  - type: web
    name: url-shortener-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: REDIS_URL
        sync: false
      - key: MONGO_URL
        sync: false

  - type: web
    name: url-shortener-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        value: https://url-shortener-backend-gr65.onrender.com/api/v1
      - key: REACT_APP_REDIRECT_BASE
        value: https://url-shortener-backend-gr65.onrender.com/api/v1

# Force blueprint sync
